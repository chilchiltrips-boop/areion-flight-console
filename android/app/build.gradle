plugins {
    id 'com.android.application'
}

def repo = rootProject.projectDir.parentFile
def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
def generatedAssets = layout.buildDirectory.dir('generated/apControlAssets')
def sharedModules = new groovy.json.JsonSlurper().parse(rootProject.file('shared-modules.json'))
def controllerAssets = tasks.register('prepareControllerAssets', Exec) {
    workingDir repo
    inputs.dir rootProject.file('controller')
    inputs.file rootProject.file('shared-modules.json')
    inputs.file rootProject.file('scripts/prepare-controller.mjs')
    inputs.files sharedModules.collect { new File(repo, "web/${it}") }
    outputs.dir(generatedAssets.map { it.dir('controller') })
    commandLine 'node', 'android/scripts/prepare-controller.mjs', generatedAssets.get().dir('controller').asFile
}

android {
    namespace 'in.zebjus.areion'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'in.zebjus.areion.console'
        minSdk 26
        targetSdk 35
        versionCode appVersion.getProperty('versionCode').toInteger()
        versionName appVersion.getProperty('versionName')
        testInstrumentationRunner 'in.zebjus.areion.AreionTouchInstrumentation'
    }
    sourceSets {
        main.assets.srcDir generatedAssets
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.preview' }
    }
}
tasks.named('preBuild') { dependsOn controllerAssets }

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
