name: Build Areion Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - 'firmware/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --ignore-scripts
      - name: Test A1 and Android controls
        run: npm test
      - uses: actions/cache/restore@v4
        with:
          path: build/firmware-release
          key: areion-c6-core-3.3.7-${{ hashFiles('firmware/**', 'scripts/package-firmware.mjs', 'scripts/firmware-sources.py', 'web/firmware-release.js') }}
      - name: Verify matching A1 firmware
        id: firmware
        continue-on-error: true
        run: python3 android/scripts/prepare-firmware.py
      - uses: arduino/setup-arduino-cli@v2
        if: steps.firmware.outcome == 'failure'
      - name: Compile firmware when no matching published release is available
        if: steps.firmware.outcome == 'failure'
        run: |
          url=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$url"
          arduino-cli core install esp32:esp32@3.3.7 --additional-urls "$url"
          arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C6 --libraries firmware/libraries --build-path "$RUNNER_TEMP/areion-firmware" firmware/AreionBrowserAP
          node scripts/package-firmware.mjs "$RUNNER_TEMP/areion-firmware" build/firmware-release "$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.7/tools/partitions/boot_app0.bin"
      - name: Assemble preview and instrumentation APKs
        run: android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Test the packaged simulator companion
        run: SIMULATOR_ASSETS="$PWD/android/app/build/generated/areionAssets/simulator" node --test android/legacy/tests/simulator.test.mjs
      - name: Verify packaged assets and Android signature
        run: |
          mkdir -p build/android-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build/android-artifacts/Areion-Flight-Console.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/android-artifacts/instrumentation.apk
          python3 android/scripts/verify-apk.py build/android-artifacts/Areion-Flight-Console.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android-artifacts/Areion-Flight-Console.apk
          cd build/android-artifacts && sha256sum Areion-Flight-Console.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: areion-android
          path: build/android-artifacts/
          if-no-files-found: error
  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: areion-android
          path: apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: |
            adb install -r apks/Areion-Flight-Console.apk
            adb install -r apks/instrumentation.apk
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell svc wifi disable
            adb shell svc data disable
            adb logcat -c
            adb shell am instrument -w -e requireOffline true in.zebjus.areion.console.preview.test/in.zebjus.areion.AreionTouchInstrumentation | tee device-result.txt
            adb logcat -b crash -d | tee device-crash.txt
            adb logcat -d -t 2200 > device-log.txt
            adb shell dumpsys activity exit-info in.zebjus.areion.console.preview > device-exit.txt
            grep -q 'PASS Areion Android' device-result.txt
            grep -q 'INSTRUMENTATION_CODE: -1' device-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-result
          path: device-*.txt
          if-no-files-found: ignore
  preview:
    if: github.ref == 'refs/heads/main'
    needs: device-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: areion-android
          path: apks
      - name: Publish a tested preview once for this app version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^versionName=//p' android/version.properties)
          build=$(sed -n 's/^versionCode=//p' android/version.properties)
          tag="android-v${version}-preview.${build}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" apks/Areion-Flight-Console.apk apks/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Areion Flight Console for Android $version (preview $build)" --prerelease --latest=false --notes "Install the signed preview on Android 8.0 or later. Join your kit Wi-Fi and tap Connect. The A1 console uses Areion Link v2. Android preview builds use development signing."
          fi
