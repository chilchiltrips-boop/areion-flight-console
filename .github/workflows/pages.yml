name: Publish web console

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - 'desktop/**'
      - 'Start Areion.command'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: areion-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test web console
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test local browser console
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1
          python -m pip install 'PySide6-Essentials>=6.6,<7' 'pyserial>=3.5,<4'
          python -m unittest discover -s tests -p 'host_*.py'
          sh -n './Start Areion.command'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
