[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zebjus-areion-link"
version = "3.12.3"
description = "Areion typed-array SDK for USB/AP control and telemetry"
readme = "SDK_README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zebjus_areion_link*"]
exclude = ["tests*", "areion_gui*"]

